name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/gitleaks" version

      - name: Scan complete Git history
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --redact=100 \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-raw.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Sanitize scan report
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          code="${SCAN_EXIT_CODE:-2}"
          raw="$RUNNER_TEMP/gitleaks-raw.json"
          report="$GITHUB_WORKSPACE/gitleaks-report.json"
          if [[ -s "$raw" ]] && jq -e 'type == "array"' "$raw" >/dev/null; then
            jq --argjson exit_code "$code" '{
              scannerExitCode: $exit_code,
              findings: [
                .[] | {
                  ruleId: .RuleID,
                  description: .Description,
                  path: .File,
                  startLine: .StartLine,
                  endLine: .EndLine,
                  commit: .Commit,
                  fingerprint: .Fingerprint
                }
              ]
            }' "$raw" > "$report"
          else
            jq -n --argjson exit_code "$code" \
              '{scannerExitCode: $exit_code, findings: []}' > "$report"
          fi
          rm -f "$raw"

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Enforce scan result
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        shell: bash
        run: |
          code="${SCAN_EXIT_CODE:-2}"
          if [[ "$code" -ne 0 ]]; then
            echo "Gitleaks scan failed with exit code $code"
            exit "$code"
          fi
